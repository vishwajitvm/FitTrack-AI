# Alembic configuration for FitTrack AI.
# The database URL is NOT stored here — it is read from DATABASE_URL (backend/.env)
# inside app/db/migrations/env.py.
#
#   alembic upgrade head                         # apply all migrations
#   alembic revision --autogenerate -m "message" # create a new migration from model changes
#   alembic downgrade -1                         # roll back one migration

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
