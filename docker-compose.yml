# FitTrack AI — full stack in Docker.
#
#   docker compose up -d --build                      # db + redis + backend + frontend
#   docker compose --profile ollama up -d --build     # ...plus a local Ollama container
#
#   Frontend  http://localhost:3000
#   Backend   http://localhost:8000   (API docs: http://localhost:8000/docs)
#
# All backend settings live in backend/.env (copy backend/.env.example first).
# Only container hostnames are overridden here.

name: fittrack-ai

services:
  db:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 with the pgvector extension
    restart: unless-stopped
    env_file: ./backend/.env       # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Container-network hostnames (override the localhost values in backend/.env)
      DATABASE_HOST: db  # swaps the host inside DATABASE_URL; credentials stay in backend/.env
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      UPLOAD_DIR: /app/data/uploads
      EXPORT_DIR: /app/data/exports
      MODEL_DIR: /app/data/models  # on-device ML models (persisted in the backend_data volume)
      WATCHFILES_FORCE_POLLING: "true"  # reliable hot reload on Windows/macOS bind mounts
    # Hot reload for development: code is mounted from ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ./backend/app:/app/app
      - backend_data:/app/data
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the backend reach an Ollama running on your host
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    env_file: ./frontend/.env
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU (NVIDIA): uncomment the block below and install the NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  backend_data:
  ollama_models:
